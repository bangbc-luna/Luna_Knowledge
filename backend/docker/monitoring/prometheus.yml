global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: api
    authorization:
      credentials_file: /prometheus/metrics_token
    static_configs:
      - targets: ['api:4000']

  - job_name: collab
    authorization:
      credentials_file: /prometheus/metrics_token
    static_configs:
      - targets: ['collab:4001']

  - job_name: worker
    authorization:
      credentials_file: /prometheus/metrics_token
    static_configs:
      - targets: ['worker:9464']

  - job_name: node
    file_sd_configs:
      - files: ['/prometheus/node_targets.json']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
